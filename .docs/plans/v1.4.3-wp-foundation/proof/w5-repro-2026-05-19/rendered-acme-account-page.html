<style id="dailyos-entity-chip-style-inline-css">
/* EntityChip primitive — entity-type colored chip per
 * .docs/design/primitives/EntityChip.md. Self-contained primitive-inline
 * styling; consumes design tokens via theme.json. */

.wp-block-dailyos-entity-chip.dailyos-entity-chip,
.dailyos-entity-chip {
	display: inline-flex;
	align-items: center;
	gap: var(--wp--preset--spacing--xs);
	width: fit-content;
	padding: 3px 10px;
	border-radius: 3px;
	font-family: var(--wp--custom--dailyos--tokens--font-mono);
	font-size: 10px;
	font-weight: 600;
	text-transform: uppercase;
	letter-spacing: 0.06em;
	background: var(--wp--preset--color--desk-charcoal-4);
	color: var(--wp--preset--color--text-secondary);
	vertical-align: baseline;
}

/* Variant selectors chain on both base classes to match the compound-base
 * specificity (0,2,0) — otherwise single-class variants lose to the base
 * selector and the entity-derived tokens never apply. */
.wp-block-dailyos-entity-chip.dailyos-entity-chip--account,
.dailyos-entity-chip.dailyos-entity-chip--account  { background: var(--wp--preset--color--account-8);  color: var(--wp--preset--color--account); }
.wp-block-dailyos-entity-chip.dailyos-entity-chip--project,
.dailyos-entity-chip.dailyos-entity-chip--project  { background: var(--wp--preset--color--project-8);  color: var(--wp--preset--color--project); }
.wp-block-dailyos-entity-chip.dailyos-entity-chip--person,
.dailyos-entity-chip.dailyos-entity-chip--person   { background: var(--wp--preset--color--person-8);   color: var(--wp--preset--color--person); }
.wp-block-dailyos-entity-chip.dailyos-entity-chip--meeting,
.dailyos-entity-chip.dailyos-entity-chip--meeting  { background: var(--wp--preset--color--meeting-8);  color: var(--wp--preset--color--meeting); }
.wp-block-dailyos-entity-chip.dailyos-entity-chip--unknown,
.dailyos-entity-chip.dailyos-entity-chip--unknown  { background: var(--wp--preset--color--desk-charcoal-4); color: var(--wp--preset--color--text-secondary); }

.wp-block-dailyos-entity-chip.is-empty { display: none; }

.wp-block-dailyos-entity-chip.dailyos-notice {
	color: var(--wp--preset--color--text-tertiary);
	font-style: italic;
}

/*# sourceURL=http://localhost:8884/wp-content/plugins/dailyos/blocks/entity-chip/style.css */
</style>
<style id="dailyos-type-badge-style-inline-css">
/* TypeBadge primitive — account-type colored badge per
 * .docs/design/primitives/TypeBadge.md. Translation of src/components/ui/

.wp-block-dailyos-type-badge.dailyos-type-badge,

	display: inline-flex;
	align-items: center;
	width: fit-content;
	padding: 3px 10px;
	border-radius: 3px;
	font-family: var(--wp--custom--dailyos--tokens--font-mono);
	font-size: 10px;
	font-weight: 600;
	text-transform: uppercase;

/* Variant selectors chain on both base classes to match the compound-base
 * specificity (0,2,0) — otherwise single-class variants lose to the base
 * selector and the account-type tokens never apply. */

.dailyos-type-badge.dailyos-type-badge--customer { background: var(--wp--preset--color--account-12);          color: var(--wp--preset--color--account); }
.wp-block-dailyos-type-badge.dailyos-type-badge--internal,
.dailyos-type-badge.dailyos-type-badge--internal { background: var(--wp--preset--color--garden-larkspur-15);  color: var(--wp--preset--color--garden-larkspur); }
.wp-block-dailyos-type-badge.dailyos-type-badge--partner,
.dailyos-type-badge.dailyos-type-badge--partner  { background: var(--wp--preset--color--garden-rosemary-12); color: var(--wp--preset--color--garden-rosemary); }

.wp-block-dailyos-type-badge.is-empty { display: none; }

.wp-block-dailyos-type-badge.dailyos-notice {
	color: var(--wp--preset--color--text-tertiary);
	font-style: italic;
}

<style id="dailyos-health-badge-style-inline-css">
/* HealthBadge (translated from src/components/shared/HealthBadge.module.css).
 * Front-end styles for the dailyos/health-badge block. Token-only. */

.wp-block-dailyos-health-badge .dailyos-health-badge,
.dailyos-health-badge {
	display: inline-flex;
	align-items: center;
	gap: var(--wp--preset--spacing--xs);
	font-family: var(--wp--custom--dailyos--tokens--font-sans);
	font-weight: 500;
	line-height: 1;
	white-space: nowrap;
}

.dailyos-health-badge--compact  { font-size: 11px; }
.dailyos-health-badge--standard { font-size: 13px; gap: var(--wp--preset--spacing--sm); }
.dailyos-health-badge--hero     { font-size: 24px; gap: var(--wp--preset--spacing--md); padding: var(--wp--preset--spacing--md) var(--wp--preset--spacing--lg); border-radius: var(--wp--custom--dailyos--tokens--radius-editorial-md); }

.dailyos-health-badge__dot {
	width: 10px;
	height: 10px;
	border-radius: 50%;
	flex-shrink: 0;
}
.dailyos-health-badge__dot--green  { background: var(--wp--preset--color--garden-sage); }
.dailyos-health-badge__dot--yellow { background: var(--wp--preset--color--spice-saffron); }
.dailyos-health-badge__dot--red    { background: var(--wp--preset--color--spice-terracotta); }

.dailyos-health-badge__score        { font-variant-numeric: tabular-nums; color: var(--wp--preset--color--text-primary); }
.dailyos-health-badge__insufficient { color: var(--wp--preset--color--text-tertiary); font-style: italic; }

.dailyos-health-badge__trend                 { color: var(--wp--preset--color--text-tertiary); }
.dailyos-health-badge__trend--improving      { color: var(--wp--preset--color--garden-sage); }
.dailyos-health-badge__trend--declining      { color: var(--wp--preset--color--spice-terracotta); }
.dailyos-health-badge__trend--stable         { color: var(--wp--preset--color--text-tertiary); }
.dailyos-health-badge__trend--volatile       { color: var(--wp--preset--color--spice-saffron); }

.dailyos-health-badge--hero.dailyos-health-badge--band-green  { background: var(--wp--preset--color--garden-sage-10); }
.dailyos-health-badge--hero.dailyos-health-badge--band-yellow { background: var(--wp--preset--color--spice-saffron-10); }
.dailyos-health-badge--hero.dailyos-health-badge--band-red    { background: var(--wp--preset--color--spice-terracotta-10); }

/*# sourceURL=http://localhost:8884/wp-content/plugins/dailyos/blocks/health-badge/style.css */
</style>
<style id="dailyos-intelligence-quality-badge-style-inline-css">
.dailyos-intelligence-quality-badge {
	display: inline-flex;
	align-items: center;
	gap: 6px;
	padding: 3px 8px;
	--dailyos-quality-color: var(--wp--preset--color--text-tertiary);
}

.dailyos-intelligence-quality-badge[data-quality-level="developing"] {

}

.dailyos-intelligence-quality-badge[data-quality-level="ready"],
.dailyos-intelligence-quality-badge[data-quality-level="fresh"] {
	--dailyos-quality-color: var(--wp--preset--color--garden-sage);
}

.dailyos-intelligence-quality-badge__dotShell {
	position: relative;
	width: 7px;
	height: 7px;
	flex-shrink: 0;
}

.dailyos-intelligence-quality-badge__dot {
	display: block;
	width: 7px;
	height: 7px;
	border-radius: 50%;
	background: var(--dailyos-quality-color);
	flex-shrink: 0;
}

.dailyos-intelligence-quality-badge[data-quality-level="sparse"] .dailyos-intelligence-quality-badge__dot {
	opacity: 0.5;
}

.dailyos-intelligence-quality-badge__newSignalDot {
	position: absolute;
	top: -2px;
	right: -2px;
	width: 5px;
	height: 5px;

	font-size: 10px;
	font-weight: 500;
	letter-spacing: 0;
	text-transform: uppercase;
}

<style id="dailyos-freshness-indicator-style-inline-css">
.dailyos-freshness-indicator {
	display: inline-flex;
	align-items: center;
	flex-wrap: wrap;
	gap: 0 var(--wp--preset--spacing--xs);

	line-height: 1.2;
	letter-spacing: 0;
}

.dailyos-freshness-indicator--inline {

	padding: 2px 8px;
	border-radius: 999px;
	background: var(--wp--preset--color--desk-charcoal-4);
	white-space: nowrap;
}

.dailyos-freshness-indicator--strip {
	display: flex;
	margin: 6px 0 32px;
	text-transform: uppercase;
}

.dailyos-freshness-indicator__part {
	display: inline-flex;
	align-items: center;
	gap: var(--wp--preset--spacing--xs);
}

.dailyos-freshness-indicator__separator,
.dailyos-freshness-indicator__text,
.dailyos-freshness-indicator__timeText {
	color: inherit;
}

.dailyos-freshness-indicator[data-staleness="aging"] .dailyos-freshness-indicator__timeText {

}

.dailyos-freshness-indicator[data-staleness="stale"] .dailyos-freshness-indicator__timeText,
.dailyos-freshness-indicator__part[data-stale="true"] .dailyos-freshness-indicator__text {

}

</style>
<style id="dailyos-account-overview-style-inline-css">
/*
 * Account Overview block — editorial styling.
 *
 * Resolves to DailyOS theme tokens when the magazine theme is active;
 * falls back to safe local variables under stock WordPress themes (AC
 * §22 / §52 / §53).
 */

.wp-block-dailyos-account-overview {
	--dailyos-paper: var( --color-paper, #fafaf7 );
	--dailyos-ink: var( --color-ink, #1c1c1a );
	--dailyos-rule: var( --color-rule, #e2e0d8 );
	--dailyos-account: var( --color-account, #2a4a7f );
	--dailyos-trust-likely-current: var( --color-trust-likely-current, #2a7f3b );
	--dailyos-trust-use-with-caution: var( --color-trust-use-with-caution, #b06a1a );
	--dailyos-trust-needs-verification: var( --color-trust-needs-verification, #a93131 );

	background: var( --dailyos-paper );
	color: var( --dailyos-ink );
	padding: 1.5rem;
	max-width: 48rem;
	font-family: var( --font-serif, Georgia, serif );
	line-height: 1.6;
}

.wp-block-dailyos-account-overview.is-empty {
	color: var( --dailyos-ink );
	opacity: 0.7;
	font-style: italic;
}

.dailyos-block {
	margin: 1.25rem 0;
	border-top: 1px solid var( --dailyos-rule );
	padding-top: 1rem;
}

.dailyos-block header {
	display: flex;
	align-items: baseline;
	justify-content: space-between;
	gap: 0.75rem;
	margin-bottom: 0.5rem;
}

.dailyos-block h3 {
	font-size: 1.1rem;
	margin: 0;
	color: var( --dailyos-account );
}

/* Inline trust-band markup generated by the account-overview composite
 * render (see render-functions.php:281). Scoped to the composite wrapper
 * so it never reaches sibling `dailyos/trust-band-badge` blocks elsewhere
 * on the page — the block-level styles in
 * wp/dailyos/blocks/trust-band-badge/style.css own those. */
.wp-block-dailyos-account-overview [data-ds-name="TrustBandBadge"] {
	font-size: 0.75rem;
	letter-spacing: 0.04em;
	padding: 0.1rem 0.5rem;
	border-radius: 0.25rem;
	background: rgba( 0, 0, 0, 0.04 );
}

.wp-block-dailyos-account-overview [data-ds-name="TrustBandBadge"][data-ds-trust-band="likely_current"] {
	color: var( --dailyos-trust-likely-current );
}

.wp-block-dailyos-account-overview [data-ds-name="TrustBandBadge"][data-ds-trust-band="use_with_caution"] {
	color: var( --dailyos-trust-use-with-caution );
}

.wp-block-dailyos-account-overview [data-ds-name="TrustBandBadge"][data-ds-trust-band="needs_verification"] {
	color: var( --dailyos-trust-needs-verification );
}

.dailyos-stale-banner,
.dailyos-verification-banner {
	border-top: 1px solid var( --dailyos-rule );
	padding-top: 0.5rem;
	margin-top: 0.5rem;
	font-size: 0.85rem;
}

.dailyos-stale-banner::before {
	content: "Refresh";
	display: block;
	font-size: 0.7rem;
	letter-spacing: 0.08em;
	text-transform: uppercase;
	color: var( --dailyos-account );
	margin-bottom: 0.25rem;
}

.dailyos-verification-banner::before {
	content: "Verify";
	display: block;
	font-size: 0.7rem;
	letter-spacing: 0.08em;
	text-transform: uppercase;
	color: var( --dailyos-trust-needs-verification );
	margin-bottom: 0.25rem;
}

.dailyos-empty {
	font-style: italic;
	opacity: 0.7;
}

.dailyos-finis-marker {
	border: none;
	border-top: 1px solid var( --dailyos-rule );
	width: 30%;
	margin: 2rem auto 0;
}

/*# sourceURL=http://localhost:8884/wp-content/plugins/dailyos/blocks/account-overview/style.css */
</style>
