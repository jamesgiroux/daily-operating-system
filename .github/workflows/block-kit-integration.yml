name: Block Kit Banked

on:
  pull_request:
    branches:
      - dev
      - trunk
    paths:
      - 'wp/dailyos/blocks/**'
      - 'wp/dailyos/tests/blocks/**'
      - 'src-tauri/abilities-runtime/tests/block_kit_integration_harness.rs'
      - 'src-tauri/abilities-runtime/tests/fixtures/**'
      - '.docs/_archive/banked-wordpress-surface-2026-06-01/**'
      - '.github/workflows/block-kit-integration.yml'

concurrency:
  group: block-kit-banked-${{ github.ref }}
  cancel-in-progress: true

jobs:
  block-kit-banked:
    name: Banked block-kit invariant
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify block-kit work remains banked
        shell: bash
        run: |
          set -euo pipefail

          archive_root=".docs/_archive/banked-wordpress-surface-2026-06-01"
          active_block_file_count=0
          if [ -d wp/dailyos/blocks ]; then
            active_block_file_count="$(find wp/dailyos/blocks -type f | wc -l | tr -d ' ')"
          fi
          if [ "$active_block_file_count" -ne 0 ]; then
            echo "Found ${active_block_file_count} active WordPress block file(s)." >&2
            echo "Reactivating WordPress blocks must also restore the block-kit CI gates." >&2
            exit 1
          fi

          active_block_test_count=0
          if [ -d wp/dailyos/tests/blocks ]; then
            active_block_test_count="$(find wp/dailyos/tests/blocks -type f | wc -l | tr -d ' ')"
          fi
          if [ "$active_block_test_count" -ne 0 ]; then
            echo "Found ${active_block_test_count} active WordPress block PHPUnit fixture(s)." >&2
            echo "Banked block tests belong under ${archive_root}/wp/dailyos/tests/blocks/." >&2
            exit 1
          fi

          active_rust_fixture_file_count=0
          if [ -d src-tauri/abilities-runtime/tests/fixtures ]; then
            active_rust_fixture_file_count="$(find src-tauri/abilities-runtime/tests/fixtures -type f | wc -l | tr -d ' ')"
          fi
          if [ "$active_rust_fixture_file_count" -ne 0 ] || [ -f src-tauri/abilities-runtime/tests/block_kit_integration_harness.rs ]; then
            echo "Active block-kit Rust fixtures remain under src-tauri/abilities-runtime/tests/." >&2
            echo "Banked block-kit fixtures belong under ${archive_root}/src-tauri/abilities-runtime/tests/." >&2
            exit 1
          fi

          banked_block_count="$(find "${archive_root}/wp/dailyos/blocks" -name block.json | wc -l | tr -d ' ')"
          if [ "$banked_block_count" -ne 89 ]; then
            echo "Expected 89 banked WordPress block metadata files; found ${banked_block_count}." >&2
            exit 1
          fi

          echo "WordPress block-kit work is banked under ${archive_root} and outside the active build path."
