      },
      {
        "name": "cursor",
        "schema": {
          "type": "string"
        },
        "required": false,
        "description": "Opaque cursor returned by a previous workspace memory response."
      },
      {
        "name": "includeEntityNames",
        "schema": {
          "type": "boolean"
        },
        "required": false,
        "description": "Request entity names when the caller also has read.entity_names; otherwise names are redacted."
