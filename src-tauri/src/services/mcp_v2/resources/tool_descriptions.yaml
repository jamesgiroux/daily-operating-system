            "type": [
              "string",
              "null"
            ]
          },
          "source_handle": {
            "type": [
              "string",
              "null"
            ]
          },
          "entity_type": {
            "type": "string"
          },
          "entity_id": {
            "type": "string"
          },
          "category": {
            "type": "string"
          },
          "workspace_file_kind": {
            "type": "string"
          },
          "source_asof": {
            "type": [
              "string",
              "null"
            ]
          },
          "lifecycle_state": {
            "type": "string"
          },
          "claim_count_produced": {
            "type": "integer"
          },
          "idempotent_replay": {
            "type": "boolean"
          },
          "dry_run": {
            "type": "boolean"
          },
          "resolved_path": {
            "type": [
              "string",
              "null"
            ]
          },
          "mutation_cursor": {
            "type": "object"
          }
        }
      },
      "description": "Opaque placement receipt"
    },
    "examples": [
